[package]
name = "subtask"
version = "0.1.0"
edition = "2021"
authors = ["Subtask Contributors"]
description = "Parallel task management and orchestration for AI coding agents"
license = "MIT"
repository = "https://github.com/zippoxer/subtask"
keywords = ["ai", "agent", "task", "orchestration", "git"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database
rusqlite = { version = "0.30", features = ["bundled"] }

# Git operations
git2 = "0.18"

# TUI
ratatui = "0.25"
crossterm = "0.27"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# File system & paths
dirs = "5.0"
walkdir = "2.4"

# Time & date
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.6", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Process management
nix = { version = "0.27", features = ["signal", "process"] }

# Platform-specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.9"
assert_cmd = "2.0"
predicates = "3.0"

[[bin]]
name = "subtask"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1
